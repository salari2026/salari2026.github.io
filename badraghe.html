<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بدرقه | شعر سپید</title>
  
  <!-- فونت وزیرمتن -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #f7f3e9;
      --bg-card: #f2ece0;
      --bg-accent: #e9e0ce;
      --text-main: #2c2520;
      --text-muted: #6b5e52;
      --text-poem: #1e1814;
      --accent: #8c4a32;
      --accent-hover: #6a3522;
      --border-color: #d8cdb8;
      --shadow-color: rgba(44, 37, 32, 0.07);
      --font-family: 'Vazirmatn', sans-serif;
    }

    [data-theme="dark"] {
      --bg-base: #1c1815;
      --bg-card: #25201c;
      --bg-accent: #2d2722;
      --text-main: #d8cdb8;
      --text-muted: #9e9182;
      --text-poem: #ebdcc9;
      --accent: #d48a6a;
      --accent-hover: #e59f80;
      --border-color: #3d342d;
      --shadow-color: rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-family);
      line-height: 1.8;
      transition: background-color 0.4s ease, color 0.4s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(var(--text-muted) 0.5px, transparent 0.5px);
      background-size: 24px 24px;
      opacity: 0.05;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 24px;
      width: 100%;
      position: relative;
      z-index: 2;
    }

    header {
      padding: 24px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 40px;
    }

    .header-inner {
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    nav {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    nav a:hover, nav a.active {
      color: var(--accent);
      font-weight: 500;
    }

    .theme-toggle {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .theme-toggle:hover {
      background-color: var(--bg-accent);
      border-color: var(--accent);
    }

    .poem-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 48px;
      margin-bottom: 60px;
      align-items: start;
    }

    .poem-column { text-align: right; }

    .poem-date {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 12px;
      font-weight: 400;
    }

    .poem-title {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text-poem);
      margin-bottom: 32px;
      line-height: 1.3;
    }

    .poem-content {
      font-size: 1.15rem;
      line-height: 2.3;
      color: var(--text-poem);
      font-weight: 400;
      margin-bottom: 40px;
    }

    .poem-stanza { margin-bottom: 28px; }
    .poem-stanza p { margin-bottom: 4px; }

    .poem-actions {
      display: flex;
      gap: 16px;
      padding-top: 24px;
      border-top: 1px dashed var(--border-color);
    }

    .btn-action {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background-color: var(--bg-accent);
      border-color: var(--accent);
    }

    .media-column {
      position: sticky;
      top: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .poem-artwork {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 8px 20px var(--shadow-color);
    }

    .artwork-img-wrapper {
      width: 100%;
      height: 280px;
      overflow: hidden;
      border-radius: 8px;
      background-color: var(--bg-accent);
    }

    .artwork-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: sepia(15%) contrast(95%);
      transition: transform 0.5s ease;
    }

    .poem-artwork:hover img { transform: scale(1.03); }

    .artwork-caption {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 10px;
    }

    .audio-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 12px var(--shadow-color);
    }

    .audio-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .audio-icon {
      width: 38px;
      height: 38px;
      background-color: var(--bg-accent);
      color: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .audio-info h4 { font-size: 0.95rem; font-weight: 600; }
    .audio-info p { font-size: 0.8rem; color: var(--text-muted); }

    audio { width: 100%; height: 40px; border-radius: 8px; outline: none; }

    .poem-navigation {
      display: flex;
      justify-content: space-between;
